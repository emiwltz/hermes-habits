/* Dark is the film's look and the default; light only on ?theme=light or the toggle. */
:root {
  --bg: #08090B; --panel: #0C0E10; --canvas: #0C0E10; --dot: rgba(237, 235, 221, .055);
  --ink: #EDEBDD; --muted: #A8A6C4; --line: rgba(237, 235, 221, .28); --line2: rgba(237, 235, 221, .5); --edge: rgba(237, 235, 221, .75);
  --orange: #FF5F1A; --orange-t: #FF5F1A; --orange-bg: rgba(255, 95, 26, .13);
  --blue: #2516FF; --blue-t: #8A86FF; --blue-bg: rgba(37, 22, 255, .26); --blue-line: #5C52FF;
  --lilac: #8A86FF; --label: #C9C7FF; --bad: #FF3B5C; --bad-bg: rgba(255, 59, 92, .13); --bad-on: #08090B;
  --chip-bg: #EDEBDD; --chip-ink: #08090B;
  --pix: "Departure Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --txt: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #EDEBDD; --panel: #F6F4EA; --canvas: #F6F4EA; --dot: rgba(8, 9, 11, .07);
  --ink: #08090B; --muted: #55536F; --line: rgba(8, 9, 11, .38); --line2: rgba(8, 9, 11, .6); --edge: rgba(8, 9, 11, .78);
  --orange-t: #A93A00; --orange-bg: rgba(255, 95, 26, .13);
  --blue-t: #2516FF; --blue-bg: rgba(37, 22, 255, .09); --blue-line: #2516FF;
  --lilac: #5A55D6; --bad: #C4122F; --bad-bg: rgba(196, 18, 47, .1); --bad-on: #F6F4EA;
  --chip-bg: #08090B; --chip-ink: #EDEBDD;
  color-scheme: light;
}
* { box-sizing: border-box; border-radius: 0; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; padding: 14px; background: var(--bg); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 4px 4px; color: var(--ink); font: 13px/1.55 var(--pix); }
.frame { position: relative; max-width: 1360px; margin: 0 auto; padding: 26px 0 30px; border: 2px solid var(--line); }
.ftitle, .fbot { position: absolute; left: 18px; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: var(--bg); color: var(--muted); font-size: 11px; line-height: 1; max-width: calc(100% - 36px); overflow: hidden; white-space: nowrap; }
.ftitle { top: -6px; } .fbot { bottom: -6px; }
.ftitle i { width: 7px; height: 7px; background: var(--orange); flex: none; }
.ftitle span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 520px) { .ftitle .host { display: none; } }
.fbot b { font-weight: 400; background: var(--chip-bg); color: var(--chip-ink); padding: 2px 6px; text-transform: uppercase; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 8px 16px 8px; }
@media (min-width: 720px) { .wrap { padding: 8px 32px 8px; } }
.k-do, .k-use { --c: var(--blue-line); --t: var(--blue-t); --cb: var(--blue-bg); }
.k-check, .k-end { --c: var(--ink); --t: var(--ink); --cb: var(--panel); }
.k-ask { --c: var(--lilac); --t: var(--lilac); --cb: var(--panel); }
.k-llm, .k-wake { --c: var(--orange); --t: var(--orange-t); --cb: var(--orange-bg); }
.k-none { --c: var(--muted); --t: var(--muted); --cb: var(--panel); }
.dim { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.fi { width: 14px; height: 14px; flex: none; fill: none; stroke: var(--c); stroke-width: 1.7; stroke-linejoin: miter; stroke-linecap: square; }
.k-do .fi, .k-use .fi, .k-llm .fi { fill: var(--c); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.lab { display: inline-block; padding: 3px 9px; background: var(--chip-bg); color: var(--chip-ink); font-size: 13px; line-height: 1.4; text-transform: uppercase; letter-spacing: .02em; }
h1 { font-size: 33px; line-height: 1.2; margin: 12px 0 0; padding-bottom: 14px; border-bottom: 2px dashed var(--line); font-weight: 400; }
@media (max-width: 520px) { h1 { font-size: 22px; } }
h2 { font-size: 11px; margin: 26px 0 10px; color: var(--muted); font-weight: 400; text-transform: uppercase; letter-spacing: .05em; }
.lead { margin: 14px 0 0; color: var(--muted); font: 13px/1.55 var(--txt); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border: 2px solid var(--line2); background: var(--panel); color: var(--ink); font: 13px var(--pix); text-transform: uppercase; cursor: pointer; }
.btn:hover { border-color: var(--ink); }
.btn.icon { width: 32px; padding: 0; }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: square; }
@media (pointer: coarse) { .btn { height: 40px; } .btn.icon { width: 40px; } }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 16px; background: var(--panel); border: 2px solid var(--line); }
.stat { padding: 10px 16px 12px; border-left: 2px solid var(--line); min-width: 0; }
.stat:first-child { border-left: 0; }
@media (max-width: 760px) { .stats { grid-template-columns: 1fr 1fr; } .stat:nth-child(3) { border-left: 0; } .stat:nth-child(n+3) { border-top: 2px solid var(--line); } }
.sl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.sv { font-size: 22px; line-height: 1.35; overflow-wrap: anywhere; }
.sv small { font-size: 13px; color: var(--muted); }
.ss { font: 12px/1.45 var(--txt); color: var(--muted); }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); }
.card { display: flex; flex-direction: column; gap: 8px; text-align: left; width: 100%; padding: 14px 16px; background: var(--panel); color: var(--ink); border: 2px solid var(--line); font: inherit; cursor: pointer; min-width: 0; }
.card:hover { border-color: var(--ink); }
.card:focus-visible { outline: 3px solid var(--blue-t); outline-offset: 2px; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card h3 { margin: 0; min-width: 0; font-size: 16px; font-weight: 400; overflow-wrap: anywhere; }
.kind { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.card p { margin: 0; font: 12.5px/1.5 var(--txt); color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 1px 8px; border: 2px solid var(--line2); color: var(--ink); font: 12px var(--pix); white-space: nowrap; flex-shrink: 0; }
.chip i { width: 7px; height: 7px; background: currentColor; }
.st-active { background: var(--blue); border-color: var(--blue); color: var(--label); }
.st-shadow { border-color: var(--orange); color: var(--orange-t); }
.st-shadow i { background: none; border: 2px solid currentColor; }
.st-retired { border-style: dashed; color: var(--muted); }
.st-invalid { border-color: var(--bad); color: var(--bad); }
.st-example, .st-live { border-color: var(--ink); }
.st-example i { background: none; border: 2px solid currentColor; transform: rotate(45deg) scale(.8); }
.strip { display: flex; flex-wrap: wrap; gap: 4px; }
.nums { list-style: none; margin: 0; padding: 0; font: 12.5px var(--txt); }
.nums li + li { margin-top: 1px; }
.last { margin-top: auto; padding-top: 6px; border-top: 2px dashed var(--line); font: 12px var(--txt); color: var(--muted); }
.empty { padding: 18px; border: 2px dashed var(--line2); color: var(--muted); font: 13px var(--txt); }
.viewer { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; background: var(--bg); }
.bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 2px solid var(--line); background: var(--panel); }
.bar b { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.viewer iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
.foot { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 10px 20px; margin-top: 26px; font-size: 11px; color: var(--muted); }
.mark { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); font-size: 22px; line-height: 1; }
.mark svg { width: 66px; height: 20px; fill: none; stroke-width: 2.2; stroke-linecap: square; }
.mark .d { stroke: var(--orange); } .mark .s { fill: var(--blue); stroke: none; } .mark .r, .mark .w { stroke: var(--ink); }
.js .static, html:not(.js) .app { display: none; }
.static h1 { font-size: 33px; }
.static h2 { font-size: 13px; margin: 22px 0 4px; }
.static p { margin: 14px 0; font: 13px/1.55 var(--txt); overflow-wrap: anywhere; } .static p b { font-family: var(--pix); font-weight: 400; }
</style>
</head>

  <div class="stats" id="stats"></div>
  <div id="sections"></div>
  <footer class="foot"><span id="foot"></span><span class="mark"><svg viewBox="0 0 66 20" aria-hidden="true"><path class="d" d="M9 2 16 9 9 16 2 9Z"/><path class="w" d="M16 9h6"/><rect class="s" x="22" y="4" width="10" height="10"/><path class="w" d="M32 9h6"/><circle class="r" cx="44" cy="9" r="5.5"/></svg>Habits</span></footer>
</div>
<div class="fbot" aria-hidden="true"><b>habits</b><span>— the gallery</span></div>
</div>
<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="vname">
  <div class="bar"><button class="btn" id="back" type="button">← All habits</button><b id="vname"></b></div>
  <iframe id="frame" title="Reflex diagram"></iframe>
</div>
<script>
'use strict';
const G = /*HABITS_DATA*/null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
// The ledger's states in the README's words (habits/view.py keeps the same map).
const STATES = { active: 'Automatic', shadow: 'Learning', retired: 'Resting', live: 'Called by name', example: 'Example', invalid: 'Invalid' };
const KINDS_OF = ['ask', 'check', 'do', 'llm', 'use', 'end', 'wake'];
const ICON = { do: 'M1.6 1.6h8.8v8.8H1.6Z', check: 'M6 .6 11.4 6 6 11.4.6 6Z', ask: 'M6 .6 11.4 6 6 11.4.6 6ZM4.9 4.9a1.1 1.1 0 1 1 1.6 1c-.4.2-.5.4-.5.8M6 8.3v.1', use: 'M1 4h7v7H1ZM4 1h7v7', llm: 'M1.6 1.6h8.8v8.8H1.6Z', end: 'M6 1.2a4.8 4.8 0 1 0 0 9.6 4.8 4.8 0 0 0 0-9.6Z', wake: 'M6 1.2a4.8 4.8 0 1 0 0 9.6 4.8 4.8 0 0 0 0-9.6Z' };
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';
const pct = v => Math.round(v * 100) + '%';
function dur(ms) {
  if (ms == null) return '—';
  if (ms < 1000) return ms + ' ms';
  if (ms < 60000) return (ms / 1000).toFixed(1) + ' s';
  const m = Math.floor(ms / 60000), h = Math.floor(m / 60);
  return h ? `${h} h ${m % 60} min` : `${m} min ${Math.round(ms % 60000 / 1000)} s`;
}
function tok(n) { n = +n || 0; return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n); }
function trigger(t) {
  if (t === 'message') return 'message';
  if (t === 'skill') return 'skill';
  if (t && typeof t === 'object' && t.every) return 'schedule · every ' + t.every + (t.at ? ' at ' + t.at : '');
  return t ? JSON.stringify(t) : 'called';  // a trigger it does not know, as written: such a habit never runs
}
function verb(n) { return KINDS_OF.find(k => n && typeof n === 'object' && k in n); }
function numbers(d) {
  const s = d.summary || {}, out = [];
  if (d.kind === 'watch') out.push(`${plural(s.runs || 0, 'check')} · ${s.woke || 0} handed back`);
  else if (d.kind === 'one-off') out.push(`Called by name, never compared · ${plural(s.runs || 0, 'run')}`); // always live
  else if (s.agreement != null) out.push(`${pct(s.agreement)} agreement over ${plural(s.compared || 0, 'run')}`);
  else out.push(`${s.compared || 0}/${s.promote_runs || 12} runs compared`);
  if (s.shadow_ms && s.active_ms) out.push(`${dur(s.active_ms)} instead of ${dur(s.shadow_ms)} · ${Math.round(s.shadow_ms / s.active_ms)}× faster`);
  if (s.shadow_tokens && s.active_tokens != null) out.push(`${tok(s.active_tokens)} model tokens instead of ${tok(s.shadow_tokens)}`);
  return out;
}
function card(d, i) {
  const example = d.origin === 'example', st = (d.issues || []).length ? 'invalid' : example ? 'example' : d.status || 'shadow';
  const nodes = Object.values((d.habit || {}).nodes || {});
  const strip = nodes.map(n => { const f = verb(n); return f ? `<svg class="fi k-${f}" viewBox="0 0 12 12" aria-hidden="true"><path d="${ICON[f]}"/></svg>` : ''; }).join('');
  const r = d.run, last = r ? `Last run ${dur(r.ms)} · ${r.status === 'end' ? 'done' : 'handed back'}`
    : example ? `Ask Hermes to adapt it, or run it: habit_run {name: ${d.name}}` : 'No run yet';
  return `<button class="card" type="button" data-i="${i}" aria-label="Open ${esc(d.name)}">
    <div class="head"><h3>${esc(d.name)}</h3><span class="chip st-${esc(st)}"><i></i>${esc(STATES[st] || cap(st))}</span></div>
    <div class="kind">${[trigger((d.habit || {}).trigger), plural(nodes.length, 'step')].map(esc).join(' · ')}</div>
    ${d.description ? `<p>${esc(d.description)}</p>` : ''}
    <div class="strip" aria-hidden="true">${strip}</div>
    ${example ? '' : `<ul class="nums">${numbers(d).map(t => `<li>${esc(t)}</li>`).join('')}</ul>`}
    <div class="last">${esc(last)}</div></button>`;
}
function render() {
  const all = G.habits || [], mine = all.filter(d => d.origin !== 'example'), examples = all.filter(d => d.origin === 'example');
  const count = st => mine.filter(d => (d.status || 'shadow') === st && !(d.issues || []).length).length;
  $('lead').textContent = mine.length ? `${plural(mine.length, 'habit')} · ${count('active')} automatic · ${count('shadow')} learning · ${count('retired')} resting` + (count('live') ? ` · ${count('live')} called by name` : '')
    : 'No habit of your own yet: ask Hermes to turn a task you repeat into one.';
  let ms = 0, tokens = 0, handled = 0, checks = 0, woke = 0;
  for (const d of mine) {
    const s = d.summary || {}, saved = s.saved || {};
    ms += saved.ms || 0; tokens += saved.tokens || 0;
    if (d.kind === 'watch') { checks += s.runs || 0; woke += s.woke || 0; } else handled += saved.runs || 0;
  }
  const cell = (l, v, sub) => `<div class="stat"><div class="sl">${l}</div><div class="sv">${v}</div><div class="ss">${sub}</div></div>`;
  $('stats').innerHTML = cell('Time saved', ms ? dur(ms) : '<small>not measured yet</small>', 'against the model alone') + cell('Model tokens saved', tokens ? tok(tokens) : '<small>not measured yet</small>', 'same comparison') +
    cell('Requests done', handled, 'by automatic habits') + cell('Scheduled checks', checks, `${woke} handed back · with no model`);
  const section = (title, list, empty) => `<h2>${title}</h2>` + (list.length ? `<div class="grid">${list.map(d => card(d, all.indexOf(d))).join('')}</div>` : `<p class="empty">${empty}</p>`);
  $('sections').innerHTML = section('Your habits', mine, 'Habits you save with habit_save show here.') + (examples.length ? section('Examples shipped with the plugin', examples, '') : '');
  $('ftitle').textContent = '~/reflexes';
  $('foot').textContent = `Generated ${G.generated || ''} by hermes habits view · each card opens its diagram`;
  document.querySelectorAll('.card').forEach(b => { b.onclick = () => { location.hash = encodeURIComponent(all[+b.dataset.i].name); }; });
}
let opener = null;
function route() {
  const name = decodeURIComponent(location.hash.slice(1)), d = (G.habits || []).find(h => h.name === name);
  if (!d) { if (!$('viewer').hidden) { $('viewer').hidden = true; $('frame').removeAttribute('srcdoc'); if (opener) opener.focus(); } return; }
  opener = document.activeElement;
  const data = JSON.stringify({ ...d, generated: G.generated }).replace(/</g, '\\u003c');
  $('frame').srcdoc = G.template.replace('/*HABITS_DATA*/null', () => data);
  $('vname').textContent = d.name;
  $('viewer').hidden = false;
  $('back').focus();
}
$('back').onclick = () => { history.length > 1 && location.hash ? history.back() : (location.hash = ''); };
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('viewer').hidden) $('back').click(); });
addEventListener('hashchange', route);
function themeButton() {
  const b = $('theme'), dark = document.documentElement.getAttribute('data-theme') === 'dark';
  b.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme'); b.title = b.getAttribute('aria-label');
  b.innerHTML = dark ? '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3"/></svg>'
    : '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.5A6 6 0 0 1 6.5 2.5a6 6 0 1 0 7 7Z"/></svg>';
}
$('theme').onclick = () => {
  const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('habits-theme', t); } catch (e) {}
  themeButton();
  if (!$('viewer').hidden) route(); // the open diagram takes the new theme too
};
render(); themeButton(); route();
</script>
</body>
</html>
