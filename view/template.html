/* Dark is the film's look and the default; light only on ?theme=light or the toggle. */
:root {
  --bg: #08090B; --panel: #0C0E10; --canvas: #0C0E10; --dot: rgba(237, 235, 221, .055);
  --ink: #EDEBDD; --muted: #A8A6C4; --line: rgba(237, 235, 221, .28); --line2: rgba(237, 235, 221, .5); --edge: rgba(237, 235, 221, .75);
  --orange: #FF5F1A; --orange-t: #FF5F1A; --orange-bg: rgba(255, 95, 26, .13);
  --blue: #2516FF; --blue-t: #8A86FF; --blue-bg: rgba(37, 22, 255, .26); --blue-line: #5C52FF;
  --lilac: #8A86FF; --label: #C9C7FF; --bad: #FF3B5C; --bad-bg: rgba(255, 59, 92, .13); --bad-on: #08090B;
  --chip-bg: #EDEBDD; --chip-ink: #08090B;
  --pix: "Departure Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --txt: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #EDEBDD; --panel: #F6F4EA; --canvas: #F6F4EA; --dot: rgba(8, 9, 11, .07);
  --ink: #08090B; --muted: #55536F; --line: rgba(8, 9, 11, .38); --line2: rgba(8, 9, 11, .6); --edge: rgba(8, 9, 11, .78);
  --orange-t: #A93A00; --orange-bg: rgba(255, 95, 26, .13);
  --blue-t: #2516FF; --blue-bg: rgba(37, 22, 255, .09); --blue-line: #2516FF;
  --lilac: #5A55D6; --bad: #C4122F; --bad-bg: rgba(196, 18, 47, .1); --bad-on: #F6F4EA;
  --chip-bg: #08090B; --chip-ink: #EDEBDD;
  color-scheme: light;
}
* { box-sizing: border-box; border-radius: 0; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; padding: 14px; background: var(--bg); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 4px 4px; color: var(--ink); font: 13px/1.55 var(--pix); }
.frame { position: relative; max-width: 1360px; margin: 0 auto; padding: 26px 0 30px; border: 2px solid var(--line); }
.ftitle, .fbot { position: absolute; left: 18px; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: var(--bg); color: var(--muted); font-size: 11px; line-height: 1; max-width: calc(100% - 36px); overflow: hidden; white-space: nowrap; }
.ftitle { top: -6px; } .fbot { bottom: -6px; }
.ftitle i { width: 7px; height: 7px; background: var(--orange); flex: none; }
.ftitle span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 520px) { .ftitle .host { display: none; } }
.fbot b { font-weight: 400; background: var(--chip-bg); color: var(--chip-ink); padding: 2px 6px; text-transform: uppercase; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 8px 16px 8px; }
@media (min-width: 720px) { .wrap { padding: 8px 32px 8px; } }
.k-do, .k-use { --c: var(--blue-line); --t: var(--blue-t); --cb: var(--blue-bg); }
.k-check, .k-end { --c: var(--ink); --t: var(--ink); --cb: var(--panel); }
.k-ask { --c: var(--lilac); --t: var(--lilac); --cb: var(--panel); }
.k-llm, .k-wake { --c: var(--orange); --t: var(--orange-t); --cb: var(--orange-bg); }
.k-none { --c: var(--muted); --t: var(--muted); --cb: var(--panel); }
.dim { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
code { font: 12.5px var(--txt); background: var(--bg); border: 1px solid var(--line); padding: 0 5px; overflow-wrap: anywhere; }
pre { font: 12px/1.5 var(--txt); background: var(--bg); border: 1px solid var(--line); padding: 8px 10px; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 180px; overflow: auto; }
.fi { width: 14px; height: 14px; flex: none; fill: none; stroke: var(--c); stroke-width: 1.7; stroke-linejoin: miter; stroke-linecap: square; }
.k-do .fi, .k-use .fi, .k-llm .fi { fill: var(--c); }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.lab.hand { background: var(--orange); color: #08090B; }
.lab { display: inline-block; padding: 3px 9px; background: var(--chip-bg); color: var(--chip-ink); font-size: 13px; line-height: 1.4; text-transform: uppercase; letter-spacing: .02em; }
.titles { margin-top: 12px; padding-bottom: 14px; border-bottom: 2px dashed var(--line); }
h1 { font-size: 33px; line-height: 1.2; margin: 0; font-weight: 400; overflow-wrap: anywhere; }
@media (max-width: 520px) { h1 { font-size: 22px; } }
.badges { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
.desc { margin: 12px 0 0; color: var(--muted); max-width: 75ch; font: 13px/1.55 var(--txt); }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 2px 9px; border: 2px solid var(--line2); background: none; color: var(--ink); font: 13px var(--pix); white-space: nowrap; }
.chip i { width: 8px; height: 8px; background: currentColor; }
button.chip { cursor: pointer; }
.st-active { background: var(--blue); border-color: var(--blue); color: var(--label); }
.st-shadow { border-color: var(--orange); color: var(--orange-t); }
.st-shadow i { background: none; border: 2px solid currentColor; }
.st-retired { border-style: dashed; color: var(--muted); }
.st-one-off, .st-example { border-color: var(--ink); }
.st-one-off i, .st-example i { background: none; border: 2px solid currentColor; transform: rotate(45deg) scale(.8); }
.chip.ok { border-color: var(--blue-t); color: var(--blue-t); }
.chip.no { border-color: var(--bad); color: var(--bad); }
.refused { margin: 12px 0 0; padding: 8px 12px; border: 2px solid var(--bad); background: var(--bad-bg); color: var(--bad); font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 16px; background: var(--panel); border: 2px solid var(--line); }
.stat { padding: 10px 16px 12px; border-left: 2px solid var(--line); min-width: 0; }
.stat:first-child { border-left: 0; }
@media (max-width: 760px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .stat:nth-child(3) { border-left: 0; }
  .stat:nth-child(n+3) { border-top: 2px solid var(--line); }
}
.sl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.sv { font-size: 22px; line-height: 1.35; overflow-wrap: anywhere; }
.sv small { font-size: 13px; color: var(--muted); }
.ss { font: 12px/1.45 var(--txt); color: var(--muted); }
.track { height: 6px; background: var(--line); margin: 6px 0 3px; }
.track i { display: block; height: 100%; background: var(--blue-line); transition: width .45s ease; }

/* layout */
.main { display: grid; gap: 16px; margin-top: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 980px) {
  .main { grid-template-columns: minmax(0, 1.25fr) minmax(360px, 1fr); align-items: start; }
  .side { position: sticky; top: 16px; max-height: calc(100vh - 56px); overflow: auto; }
}
.card { background: var(--panel); border: 2px solid var(--line); min-width: 0; }
.tabs { display: flex; gap: 2px; padding: 0 10px; border-bottom: 2px solid var(--line); position: sticky; top: 0; z-index: 1; background: var(--panel); }
.tab { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 10px; border: 0; background: none; color: var(--muted); font: 13px var(--pix); text-transform: uppercase; cursor: pointer; box-shadow: inset 0 -3px 0 transparent; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -3px 0 var(--blue-t); }
.tab .ok { color: var(--blue-t); } .tab .no { color: var(--bad); }
.pane { padding: 14px 16px 16px; }
.chead { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.hint { color: var(--muted); font: 13px/1.55 var(--txt); margin: 6px 0 0; }
.btns { display: flex; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 2px solid var(--line2); background: var(--panel); color: var(--ink); font: 13px var(--pix); text-transform: uppercase; cursor: pointer; }
.btn svg { width: 12px; height: 12px; fill: currentColor; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--label); min-width: 100px; }
.btn.primary:hover { border-color: var(--label); }
.btn.icon { width: 32px; padding: 0; justify-content: center; }
.btn.icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: square; }
@media (pointer: coarse) { .btn { height: 40px; } .btn.icon { width: 40px; } }
@media (max-width: 520px) {
  .step { grid-template-columns: 3.4rem 14px minmax(0, 1fr) 3.8rem; grid-template-areas: "t i n m" ". . s s"; gap: 0 8px; }
  .step .t { grid-area: t; } .step .fi { grid-area: i; } .step .sn { grid-area: n; } .step .ss { grid-area: s; } .step .ms { grid-area: m; }
}
:focus-visible { outline: 3px solid var(--blue-t); outline-offset: 2px; }

/* graph */
.scroll { overflow-x: auto; background: var(--canvas); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 4px 4px; }
.gcard { overflow: hidden; }
.sw { position: relative; }
.fade { position: absolute; top: 0; bottom: 0; width: 24px; pointer-events: none; }
.fade.l { left: 0; background: linear-gradient(90deg, var(--canvas), transparent); }
.fade.r { right: 0; background: linear-gradient(270deg, var(--canvas), transparent); }

<body>
<div class="frame">

<div class="wrap static"><!--HABITS_STATIC--></div>
<div class="wrap app">
  <header>

    </section>
  </main>
  <footer class="foot"><span id="foot"></span><span class="mark"><svg viewBox="0 0 66 20" aria-hidden="true"><path class="d" d="M9 2 16 9 9 16 2 9Z"/><path class="w" d="M16 9h6"/><rect class="s" x="22" y="4" width="10" height="10"/><path class="w" d="M32 9h6"/><circle class="r" cx="44" cy="9" r="5.5"/></svg>Habits</span></footer>
</div>
<div class="fbot" aria-hidden="true"><b>habits</b><span id="fbot">the reflex</span></div>

<script>
'use strict';
const D = /*HABITS_DATA*/null;

const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const KINDS = ['ask', 'check', 'do', 'llm', 'use', 'end', 'wake'];
const ABOUT = {
  ask: 'Asks the decision model a closed question. Under the confidence threshold, the item becomes a doubt.',
  check: 'Computes a fixed condition. No model, so always the same answer.',
  do: 'Calls a Hermes tool through the normal path, approvals included.',
  llm: 'Hermes thinks inside the reflex: one bounded call to its model, no tools, a fixed output schema.',
  use: 'Calls another reflex; its end becomes this step\'s result.',
  end: 'Stops the habit and returns its message.',
  wake: 'Stops the habit and hands back to Hermes with its message.',
};
const RULES = ['No isolated step', 'No dead end', 'No loop', 'A fallback', 'One thing per step', 'No orphan answer', 'Small'];
const DECIDERS = { jev: 'Jev', llm: 'Hermes model', fake: 'Fake model' };
// The ledger's states and a run's outcomes in the README's words (habits/view.py keeps the same maps).
const STATES = { active: 'Automatic', shadow: 'Learning', retired: 'Resting', live: 'Called by name' };
const OUTCOMES = { end: 'done', wake: 'handed back' };
// Shapes of the steps, 12×12: do = blue square, check = diamond, ask = diamond with a ?, use = two squares,
// llm = orange square, end = ring (done), wake = orange ring (handed back), a ? alone = no single verb.
const ICON = { do: 'M1.6 1.6h8.8v8.8H1.6Z', check: 'M6 .6 11.4 6 6 11.4.6 6Z', ask: 'M6 .6 11.4 6 6 11.4.6 6ZM4.9 4.9a1.1 1.1 0 1 1 1.6 1c-.4.2-.5.4-.5.8M6 8.3v.1', use: 'M1 4h7v7H1ZM4 1h7v7', llm: 'M1.6 1.6h8.8v8.8H1.6Z', end: 'M6 1.2a4.8 4.8 0 1 0 0 9.6 4.8 4.8 0 0 0 0-9.6Z', wake: 'M6 1.2a4.8 4.8 0 1 0 0 9.6 4.8 4.8 0 0 0 0-9.6Z', none: 'M3.9 4.2a2.1 2.1 0 1 1 3 1.9c-.6.3-.9.7-.9 1.4v.3M6 9.9v.2' };
const ico = fam => `<svg class="fi k-${fam}" viewBox="0 0 12 12" aria-hidden="true"><path d="${ICON[fam]}"/></svg>`;
const code = v => `<code>${esc(typeof v === 'string' ? v : JSON.stringify(v))}</code>`;
const row = (k, v) => `<dt>${k}</dt><dd>${v}</dd>`;
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const short = (s, n) => (s = String(s)).length > n ? s.slice(0, n - 1) + '…' : s;
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
function tok(n) { n = +n || 0; return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n); }
function dur(ms) {
  if (ms == null) return '—';
  if (ms < 1000) return Math.round(ms) + ' ms';
  const s = ms / 1000;
  return (s < 10 ? +s.toFixed(1) : Math.round(s)) + ' s';
}
function mk(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}

  let s = t.textContent;
  while (whole.getComputedTextLength() > max && s.length > 2) { s = s.slice(0, -1); t.textContent = s + '…'; }
  return s;
}

// ---- data -------------------------------------------------------------
if (!D) { document.querySelector('.wrap').innerHTML = '<p class="empty">No habit data. This is the page template: <code>hermes habits view &lt;name&gt;</code> fills it.</p>'; throw new Error('no data'); }
const H = D.habit || {}, N = H.nodes && typeof H.nodes === 'object' ? H.nodes : {}, ids = Object.keys(N), S = D.summary || {}, R = D.run || null;
const steps = (R && R.steps) || [], doubts = (R && R.doubts) || [];
const handed = !!R && (R.status === 'wake' || !!R.failed); // the run ended with Hermes taking over
const oneoff = D.kind === 'one-off' || D.status === 'one-off';
const once = D.origin === 'one-off', example = D.origin === 'example'; // a graph drawn for one run; a shipped example
const has = x => typeof x === 'string' && Object.hasOwn(N, x); // own keys only: a node named "constructor" is fine
const nd = id => has(id) && N[id] && typeof N[id] === 'object' ? N[id] : {};
const verbs = id => KINDS.filter(k => Object.hasOwn(nd(id), k));
const kindOf = id => { const v = verbs(id); return v.length === 1 ? v[0] : null; }; // null: no verb, or several
const famOf = id => kindOf(id) || 'none'; // the kind of a step, which sets its look
const kname = id => verbs(id).join(' + ') || 'nothing to do';
const ends = f => f === 'end' || f === 'wake';
const exits = n => [['next', n.next], ...Object.entries(n.then && typeof n.then === 'object' ? n.then : {}), ['error', n.error], ['unsure', n.unsure]].filter(x => x[1] != null);
const threshold = n => n.min_confidence ?? H.min_confidence ?? 0.8;
const issues = (D.issues || []).map(m => {
  const r = /^rule (\d)/.exec(m), named = [...m.matchAll(/"([^"]+)"/g)].map(x => x[1]).find(has);
  return { rule: r ? +r[1] : (/^safety/.test(m) ? 'safety' : 'format'), text: m.replace(/^[^:]*:\s*/, ''), node: named };
});
const bad = new Set(issues.map(i => i.node).filter(Boolean)), badFormat = issues.some(i => i.rule === 'format');
// How a reflex starts, in the contract's four words: called, message, schedule, skill.
const trigger = t => once ? 'run once' : !t ? 'called' : t === 'message' ? 'message' : t === 'skill' ? 'skill' : t.every ? 'schedule · every ' + t.every + (t.at ? ' at ' + t.at : '') : JSON.stringify(t);
const backends = () => [...new Set(((R && R.backends) || []).flatMap(b => String(b).split(',')))].map(b => DECIDERS[b] || cap(b));
// The path of the last run: every step, then the node where it stopped.
const path = steps.map(s => s.node).concat(R && has(R.node) && !steps.some(s => s.node === R.node) ? [R.node] : []);
// What start reaches (the fallback too: any error lands there); the rest is drawn apart.
const reach = new Set();
for (const q = has(H.start) ? [H.start, H.fallback] : []; q.length;) { const u = q.shift(); if (has(u) && !reach.has(u)) { reach.add(u); exits(nd(u)).forEach(x => q.push(x[1])); } }
const lost = id => reach.size > 0 && !reach.has(id);

// ---- layout: layers by longest path from start, dummies for long edges --
const narrow = $('scroll').clientWidth < 480; // phones get narrower boxes so two fit side by side
const W = Math.min(240, Math.max(narrow ? 160 : 184, 30 + 10 * Math.max(0, ...ids.map(i => i.length)))), BH = 52, VG = 42, TOP = 40, GAP = narrow ? 16 : 28, DW = 18, BAND = 36;
const spread = (k, i, half) => k < 2 ? 0 : (i - (k - 1) / 2) * Math.min(26, 2 * half / (k - 1)); // port offsets along a box edge
function layout() {
  const E = [], P = {};
  ids.forEach(u => {
    const m = new Map(), o = P[u] = { id: u, w: W, up: [], down: [], ghosts: [], stub: [] };
    exits(nd(u)).forEach(([k, v]) => {
      const lab = k === 'next' ? '' : k;
      if (!has(v)) o.ghosts.push({ lab, v: String(v) });
      else if (lost(u) && !lost(v)) o.stub.includes(v) || o.stub.push(v); // leaves the unreachable band: a pill, not an edge
      else m.set(v, [...(m.get(v) || []), lab]);
    });
    if (m.has(H.fallback) && u !== H.fallback) { // error and unsure to the fallback: a "→ help" pill, unless a real answer goes there too
      const ls = m.get(H.fallback), real = ls.filter(l => l !== 'error' && l !== 'unsure');
      if (!real.length) { m.delete(H.fallback); o.stub.push(H.fallback); }
    }
    m.forEach((ls, v) => E.push({ u, v, lab: ls.filter(Boolean).join(' · '), err: ls.every(l => l === 'error') }));
  });
  const out = u => E.filter(e => e.u === u), seen = {}, order = [];
  const dfs = u => { seen[u] = 1; out(u).forEach(e => { if (seen[e.v] === 1) e.back = true; else if (!seen[e.v]) dfs(e.v); }); seen[u] = 2; order.unshift(u); };
  [H.start, ...ids].forEach(u => { if (has(u) && !seen[u]) dfs(u); });
  const L = {};
  order.forEach(u => { L[u] = L[u] || 0; out(u).forEach(e => { if (!e.back) L[e.v] = Math.max(L[e.v] || 0, L[u] + 1); }); });
  const fb = H.fallback, main = ids.filter(i => !lost(i)); // the fallback sits at the bottom, beside the ends
  if (has(fb) && !out(fb).length) L[fb] = Math.max(1, ...main.map(i => L[i]));
  const band = main.length < ids.length ? Math.max(0, ...main.map(i => L[i])) + 1 : null;
  ids.forEach(i => { if (lost(i)) L[i] += band; });
  const rows = [], put = o => ((rows[o.r] = rows[o.r] || []).push(o), o);
  ids.forEach(id => { P[id].r = L[id]; put(P[id]); });

    what = `<p class="quote">${esc(n.ask)}</p><dl>${n.pick ? row('picks', code(n.pick) + ` <span class="dim">one item, margin ${esc(String(n.margin ?? 0.15))}</span>`) : row('answers', opts.map(code).join(n.score ? ' → ' : ' '))}${row('threshold', code(String(threshold(n))) + (n.min_confidence == null ? ' <span class="dim">habit default</span>' : ''))}</dl>`;
  } else if (k === 'check') {
    what = `<dl>${row('condition', Object.entries(n.check || {}).map(([op, v]) => code(op + ': ' + (Array.isArray(v) ? v.join(', ') : v))).join(' '))}</dl>`;
  } else if (k === 'do') {
    const { command, ...rest } = n.args || {};
    what = `<dl>${row('tool', code(n.do) + (n.read ? ' <span class="dim">read only</span>' : ''))}${command ? row('command', `<pre>${esc(command)}</pre>`) : ''}${Object.keys(rest).length ? row('args', `<pre>${esc(JSON.stringify(rest, null, 2))}</pre>`) : ''}</dl>`;
  } else if (k === 'llm') {
    what = `<p class="quote">${esc(n.llm)}</p>` + (n.schema ? `<dl>${row('schema', Object.entries(n.schema).map(([f, t]) => code(f + ': ' + t)).join(' '))}</dl>` : '');
  } else if (k === 'use') what = `<dl>${row('habit', code(n.use))}</dl>`;
  else if (k) what = `<p class="quote">${esc(n[k])}</p>`;
  else what = `<pre class="pre">${esc(JSON.stringify(n, null, 2))}</pre>`;
  if (n.as) mods += row('as', code(n.as) + ' <span class="dim">stores the result</span>');
  if (n.each) mods += row('each', code(n.each) + ' <span class="dim">once per item</span>');
  if (n.where) mods += row('where', Object.entries(n.where).map(([a, b]) => code(`${a} = ${b}`)).join(' '));
  if (n.with) mods += row('with', [].concat(n.with).map(code).join(' '));
  const ex = exits(n);
  const links = ex.map(([a, v]) => has(v) ? `<button class="go" type="button" data-node="${esc(v)}"><span>${esc(a)} →</span> ${esc(v)}</button>` : `<span class="go miss"><span>${esc(a)} →</span> ${esc(v)} · missing</span>`).join('') +
    (!ends(fam) && has(H.fallback) ? ` <span class="dim">errors and doubts → ${esc(H.fallback)}</span>` : '');
  let last;
  if (!R) last = '<p class="hint">No run yet.</p>';
  else if (s) {
    const thr = threshold(n), ans = (s.answers || []).slice().sort((x, y) => (x[2] >= thr) - (y[2] >= thr)); // doubts first
    last = `<p class="sum">${esc(s.summary)}</p><dl>${row('started', '+' + dur(s.t))}${row('took', dur(s.ms))}${s.backend ? row('decided by', esc(String(s.backend).split(',').map(b => DECIDERS[b] || cap(b)).join(' + '))) : ''}</dl>` +
      (ans.length ? `<div class="tbl"><table><thead><tr><th>${ans[0][0] == null ? '' : 'item'}</th><th>answer</th><th>confidence</th></tr></thead><tbody>${ans.map(([it, a, c]) =>
        `<tr${c < thr ? ' class="low"' : ''}><td>${esc(it ?? '—')}</td><td>${esc(a)}${c < thr ? ' · doubt' : ''}</td><td><span class="bar"><i style="width:${Math.round(c * 100)}%"></i></span>${(+c).toFixed(2)}</td></tr>`).join('')}${s.answers_cut ? `<tr class="more"><td colspan="3">+${s.answers_cut} more not kept in the trace</td></tr>` : ''}</tbody></table></div>` : '') +
      (s.out ? `<pre class="pre">${esc(s.out)}</pre>` : '') + (s.error ? `<p class="err">${esc(s.error)}</p>` : '');
  } else if (j >= 0) last = `<p class="sum">The run stopped here: <b>${esc(OUTCOMES[R.status] || R.status)}</b>${R.reason ? ' · ' + esc(R.reason) : ''}.</p>`;
  else last = `<p class="hint">Not reached in the last run.</p>`;
  const planned = ((R && R.planned) || []).filter(p => p.node === sel);
  if (planned.length) last += `<p class="hint">Planned, not executed:</p><pre class="pre">${esc(planned.map(p => p.tool + ' ' + JSON.stringify(p.args)).join('\n'))}</pre>`;
  const about = k ? ABOUT[k] : vs.length ? `Does ${vs.join(' and ')} at once, but a step does exactly one thing: split it.` : 'Does nothing yet: give it exactly one of ask, check, do, llm, use, end or wake.';
  box.className = 'pane k-' + fam;
  box.innerHTML = `<div class="chead"><div class="nhead"><span class="kchip k-${fam}">${ico(fam)}${esc(kname(sel))}</span><span class="nm">${esc(sel)}</span>${sel === H.start ? '<span class="chip">start</span>' : ''}${sel === H.fallback ? '<span class="chip">fallback</span>' : ''}${lost(sel) ? '<span class="chip">not reachable</span>' : ''}</div>
    <button class="btn" type="button" id="close">Close</button></div>
    <p class="about">${about}</p>${issues.filter(i => i.node === sel).map(i => `<p class="err">${esc(i.text)}</p>`).join('')}${what}${mods ? `<dl>${mods}</dl>` : ''}
    ${ex.length || !ends(fam) ? `<h3>Exits</h3><dl><dt class="sr">exits</dt><dd>${links}</dd></dl>` : ''}
    <h3>Last run</h3>${last}`;
  $('close').onclick = () => select(sel);
  box.querySelectorAll('button.go').forEach(b => { b.onclick = () => select(b.dataset.node, true); });
}

// ---- header and rules -------------------------------------------------
const failed = new Set(issues.map(i => i.rule)), nRules = [...failed].filter(r => typeof r === 'number').length;
const rulesText = () => !issues.length ? '✓ 7 rules' : '✕ ' + [nRules ? plural(nRules, 'rule') : '', failed.has('safety') ? 'safety' : '', badFormat ? 'format' : ''].filter(Boolean).join(' · ');
function renderHead() {
  document.title = (D.name || 'Habit') + ' · Habits';
  $('name').textContent = D.name || 'Unnamed habit';
  $('desc').textContent = D.description || (once ? 'A reflex Hermes drew for one run.' : '');
  $('foot').textContent = `Generated ${D.generated || ''} by hermes habits view · format ${H.spec || 'habits/0.1'}`;
  $('ftitle').textContent = '~/reflexes/' + (D.name || '');
  $('lab').textContent = !R ? 'The reflex' : 'Run · ' + (handed ? 'handed back' : 'done');
  $('lab').classList.toggle('hand', !!handed);
  $('fbot').textContent = '— ' + (R ? 'the replay' : 'the diagram');
  const st = oneoff || example ? 'one-off' : D.status || 'shadow';
  $('badges').innerHTML = `<span class="chip st-${esc(st)}"><i></i>${esc(example ? 'Example' : st === 'one-off' ? (once ? 'Run once' : 'Called by name') : STATES[st] || cap(st))}</span>` + (oneoff || example ? '' : `<span class="chip">${esc(trigger(H.trigger))}</span>`) +
    `<button class="chip ${issues.length ? 'no' : 'ok'}" type="button" id="rchip" title="Show the rules">${rulesText()}</button>`;
  $('rchip').onclick = () => { open('rules'); if (innerWidth < 980) $('side').scrollIntoView({ block: 'start' }); };
  if (issues.length) { $('refused').hidden = false; $('refused').textContent = `Refused: ${plural(issues.length, 'issue')} to fix before this habit can run.`; }
  const cell = (label, value, sub) => `<div class="stat"><div class="sl">${label}</div><div class="sv">${value}</div><div class="ss">${sub}</div></div>`;
  const c = (R && R.counts) || {}, used = backends(), pct = v => Math.round(v * 100) + '%', need = S.promote_runs || 12;
  const decided = cell('Last run decided by', !R ? '—' : used.length ? esc(used.join(' + ')) : 'Rules only', R ? `${plural(c.questions || 0, 'decision question')} · ${plural(c.llm || 0, 'model call')}` : 'no run yet');
  if (oneoff || example) { // no history to compare (an example never learns): show what this run did
    const items = Math.max(0, ...steps.map(count)), num = v => R && v != null ? v : '—';
    $('stats').innerHTML = cell(items ? 'Items' : 'Steps', R ? items || steps.length : '—', R ? 'handled in ' + dur(R.ms) : 'no run yet') +
      cell('Tool calls', num(c.tools), R ? plural(c.steps || 0, 'item step') : '') + cell('Decision questions', num(c.questions), R ? used.length ? 'answered by ' + esc(used.join(' + ')) : 'none needed' : '') +
      cell('Model calls', num(c.llm), R ? (R.status === 'wake' ? 'then handed back to Hermes' : 'then done') : '');
    return;
  }
  const agree = S.agreement == null ? cell('Agreement', '—', 'not compared yet')
    : cell('Agreement', `${pct(S.agreement)} <small>over ${plural(S.compared || 0, 'run')}</small>`, st === 'shadow'
      ? `<div class="track" role="progressbar" aria-label="Runs toward your yes" aria-valuemin="0" aria-valuemax="${need}" aria-valuenow="${Math.min(need, S.compared || 0)}"><i style="width:${Math.min(100, 100 * (S.compared || 0) / need)}%"></i></div>${Math.min(need, S.compared || 0)}/${need} runs toward your yes, needs ${pct(S.promote_agreement || .9)}`
      : 'same result as Hermes');
  const gain = D.kind === 'watch' ? cell('Checks', `${S.runs ?? 0} <small>checks · ${S.woke || 0} handed back</small>`, esc(trigger(H.trigger)))
    : S.shadow_ms && S.active_ms ? cell('Measured gain', `${dur(S.active_ms)} <small>instead of ${dur(S.shadow_ms)}</small>`, `median turn · ${Math.round(S.shadow_ms / S.active_ms)}× faster` +
      (S.shadow_tokens && S.active_tokens != null ? ` · ${tok(S.active_tokens)} model tokens instead of ${tok(S.shadow_tokens)}` : ''))
    : cell('Measured gain', '—', st === 'active' ? 'not enough timed runs yet' : 'measured once it runs automatically');
  const runs = S.runs != null && D.kind !== 'watch' ? ` · ${plural(S.runs, 'run')} in all` : '';
  $('stats').innerHTML = agree + gain + cell('Last run', R ? dur(R.ms) : '—', R ? (R.status === 'end' ? 'done' : 'handed back') + runs : 'no run yet') + decided;
}
function renderRules() {
  const line = (rule, name, num) => {
    const list = issues.filter(i => i.rule === rule), skip = badFormat && rule !== 'format'; // a bad format stops validation early
    return `<li class="${skip ? 'skip' : list.length ? 'no' : 'ok'}"><span class="mk" aria-hidden="true">${skip ? '–' : list.length ? '✕' : '✓'}</span><span class="rn">${num ? num + '. ' : ''}${name}<span class="sr">${skip ? ': not checked' : list.length ? ': broken' : ': passes'}</span></span>${list.map(i => `<p>${esc(i.text)}</p>`).join('')}</li>`;
  };
  $('t-rules').innerHTML = `Rules <span class="${issues.length ? 'no' : 'ok'}">${issues.length ? '✕ ' + failed.size : '✓'}</span>`;
  $('rules').innerHTML = `<p class="rsum${issues.length ? ' no' : ''}">${badFormat ? 'The format is invalid, so the rules were not checked.' : issues.length ? `${plural(failed.size, 'check')} failed: this habit cannot run.` : 'All 7 rules and the safety checks pass.'}</p>
    <ol class="rules">${RULES.map((r, i) => line(i + 1, r, i + 1)).join('')}${line('safety', 'Safety: no deletion, read-only reads, no model-written value in a command')}${badFormat ? line('format', 'Format') : ''}</ol>`;
}
function themeButton() {
  const b = $('theme'), dark = document.documentElement.getAttribute('data-theme') === 'dark';
  b.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme'); b.title = b.getAttribute('aria-label');
  b.innerHTML = dark ? '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3"/></svg>'
    : '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.5A6 6 0 0 1 6.5 2.5a6 6 0 1 0 7 7Z"/></svg>';
}
$('theme').onclick = () => {
  const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('habits-theme', t); } catch (e) {}
  themeButton();
};

renderHead(); renderRun(); renderNode(); renderRules(); themeButton(); open(tab);
// The graph measures its texts to place them: wait (at most 1.5 s) for the embedded face, then draw.
const faceReady = (async () => { try { await Promise.race([document.fonts.load('13px "Departure Mono"'), new Promise(r => setTimeout(r, 1500))]); } catch (e) {} })();
faceReady.then(() => {
if (ids.length) {
  drawGraph(); legend();
  show(path.length - 1); // open on the finished run; Replay plays it again
  const box = $('scroll'), s = P[path.length ? path[path.length - 1] : H.start], fades = () => { // 24 px fades on the edges that hide something
    document.querySelector('.fade.l').hidden = box.scrollLeft < 2;
    document.querySelector('.fade.r').hidden = box.scrollLeft + box.clientWidth > box.scrollWidth - 2;
  };
  if (s && box.scrollWidth > box.clientWidth) { const r = s.g.getBoundingClientRect(), b = box.getBoundingClientRect(); box.scrollLeft += r.left + r.width / 2 - b.left - b.width / 2; } // the step the run ended on, or the start, in the middle
  fades(); box.addEventListener('scroll', fades); addEventListener('resize', fades);
} else { $('scroll').innerHTML = '<p class="empty">No steps to draw.</p>'; $('legend').hidden = true; }
const q = new URLSearchParams(location.search);
if (has(q.get('node'))) select(q.get('node'), true, true);
if (q.has('tab') && TABS.includes(q.get('tab'))) open(q.get('tab'));
if (q.has('replay') && R) replay();
});
</script>
</body>
</html>
