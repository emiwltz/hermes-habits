name: habits
version: 0.1.0
description: >-
  Reflexes for Hermes: the tool calls and small decisions Hermes repeats,
  grouped into small files of steps that Hermes runs as written, with no model
  turn between the steps. A reflex ends done, or handed back with what is left,
  and acts alone only after your yes.
author: Émilien Waltz
license: MIT
homepage: https://github.com/emiwltz/hermes-habits
manifest_version: 2
requires_hermes: ">=0.22.5"
platforms: [linux, macos]
optional_env:
  - name: HABITS_OFF
    description: "Set to a non-empty value to turn every hook except the guard off (the tools stay), for example to measure Hermes without habits."
    password: false
provides_tools:
  - habit_run
  - habit_save
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - post_llm_call
  - post_api_request
  - on_session_finalize
  - transform_tool_result
python_dependencies:
  - "pyyaml>=6.0,<7"
config_schema:
  learning:
    type: str
    enum: ["off", suggest, practice, auto]
    default: suggest
    label: Learning
    description: "off: nothing is spotted or practiced (habits already automatic keep acting). suggest (the default): the dream shows what comes back and nothing is run until you say try. practice: up to 3 reflexes practice on their own beside Hermes and wait for your yes. auto: every reflex the dream made becomes automatic as soon as it is ready, with no question and one line of news (one step or several, reading or acting), except a reflex with a deleting command or a command Hermes would ask approval for, which always waits for your yes."
  caution:
    type: str
    enum: [relaxed, normal, strict]
    default: normal
    label: Caution
    description: "How much proof a habit needs before it is ready and before it rests: relaxed asks for fewer matching runs, strict for more."
  dream:
    type: str
    enum: [daily, manual]
    default: daily
    label: The dream
    description: "daily: the dream re-reads what Hermes did after a reply, once a day at most. manual: only when you run it. Any other word is read as manual."
  decision_model:
    type: str
    enum: [auto, jev, hermes]
    default: auto
    label: Decision model
    description: "The small model that answers a habit's questions. auto asks Jev when its key is set, else your Hermes model. jev asks Jev first, then your Hermes model. hermes asks your Hermes model only; no question goes to Jev."
  permissions:
    type: str
    enum: [hermes, strict]
    default: hermes
    label: Permissions
    description: "hermes: a habit you said yes to may run, inside a Hermes turn, the commands Hermes's own approval rules allow (they ask you, or refuse). strict: the plugin refuses every sensitive or deleting command beforehand. Any other word is read as strict."
  model_text:
    type: str
    enum: [quoted, never]
    default: quoted
    label: Model text in commands
    description: "quoted: text written by a model may enter a command as one quoted piece, never as code. never: it never enters a command. Any other word is read as never."
  language:
    type: str
    enum: [en, fr]
    default: en
    label: Language
    description: The language of the plugin's own lines (/habits, hermes habits list, the news of a habit).
  typesafe_api_key:
    type: secret
    env: TYPESAFE_API_KEY
    label: Jev key
    description: Optional. Fast decisions with Jev.
