[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reflexes"
version = "0.2.0.dev0"
description = "Reflexes: small Python functions an agent runs without thinking"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Émilien Waltz" }]
requires-python = ">=3.10"
dependencies = ["pydantic-monty>=1.6,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reflex = "reflexes.cli:main"

[tool.setuptools]
packages = ["reflexes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
